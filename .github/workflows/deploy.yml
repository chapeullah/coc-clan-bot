name: CI/CD to VPS
run-name: Deploy ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_dispatch:

concurrency:
  group: coc-clan-bot-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install transfer tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Stop, upload, build and run
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            "root@$SSH_HOST" "
              set -e
              mkdir -p /opt/coc-clan-bot
              cd /opt/coc-clan-bot

              if [ -f docker-compose.yml ]; then
                docker compose down
              fi
            "

          sshpass -e rsync -az --delete \
            --include='/src/***' \
            --include='/pom.xml' \
            --include='/Dockerfile' \
            --include='/docker-compose.yml' \
            --exclude='*' \
            ./ "root@$SSH_HOST:/opt/coc-clan-bot/"

          sshpass -e ssh "root@$SSH_HOST" "
            set -e
            cd /opt/coc-clan-bot

            docker compose build --no-cache --pull app
            docker compose up -d --wait --wait-timeout 90 db
            docker compose up -d --force-recreate --no-deps --wait --wait-timeout 120 app
            docker builder prune -af
          "
