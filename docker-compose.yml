services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"
    environment:
      POSTGRES_DB: gucci
      POSTGRES_USER: gucci
      POSTGRES_PASSWORD: gucci
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gucci
      SPRING_DATASOURCE_USERNAME: gucci
      SPRING_DATASOURCE_PASSWORD: gucci
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Europe/Moscow"
      APP_READINESS_FILE: /tmp/coc-clan-bot.ready
      LOG_DIR: /logs
      LOGGING_LEVEL_COM_CHAPEULLAH_COCCLANBOT: INFO

      COC_API_TOKEN: ${COC_API_TOKEN}
      COC_CLAN_TAG: ${COC_CLAN_TAG}
      COC_API_BASE_URL: ${COC_API_BASE_URL}
      COC_API_RESPONSE_TIMEOUT_MS: ${COC_API_RESPONSE_TIMEOUT_MS}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_POLL_DELAY_MS: ${TELEGRAM_BOT_POLL_DELAY_MS:-1000}
      TELEGRAM_SYSTEM_USER_ID: ${TELEGRAM_SYSTEM_USER_ID}
      TELEGRAM_ADMIN_USER_IDS: ${TELEGRAM_ADMIN_USER_IDS}

    volumes:
      - applogs:/logs
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/coc-clan-bot.ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s

volumes:
  pgdata:
  applogs:
