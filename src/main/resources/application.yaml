coc:
  base-url: ${COC_API_BASE_URL}
  api-token: ${COC_API_TOKEN}
  clan-tag: ${COC_CLAN_TAG}

spring:
  task:
    scheduling:
      pool:
        size: 3
  application:
    name: gucci-goblin

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: 'true'
        jdbc:
          batch_size: 50

  main:
    web-application-type: none

logging:
  level:
    com.chapeullah.guccigoblin: INFO
